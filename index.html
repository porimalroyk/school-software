<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduManage BD - শিক্ষা প্রতিষ্ঠান ম্যানেজমেন্ট সফটওয়্যার</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Hind Siliguri -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS for Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .tab-active { background-color: #1e40af; color: white; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <!-- Top Navbar -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button id="menuToggle" class="md:hidden p-1 rounded hover:bg-blue-800">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="flex items-center gap-2">
                    <i data-lucide="graduation-cap" class="w-8 h-8 text-amber-400"></i>
                    <div>
                        <h1 class="text-lg md:text-xl font-bold leading-tight">কর্ণ অ্যাবাকাস মাস্টার বিদ্যাপীঠ ও কলেজ</h1>
                        <p class="text-xs text-blue-200">ডিজিটাল ম্যানেজমেন্ট সিস্টেম (সম্পূর্ণ সংস্করণ)</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="switchTab('guardian-login')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                    <i data-lucide="user-check" class="w-4 h-4"></i> অভিভাবক প্যানেল
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="hidden md:block w-full md:w-64 bg-white shadow-md p-4 space-y-1.5">
            <p class="text-xs font-semibold text-slate-400 uppercase px-3 mb-2">স্টুডেন্ট ম্যানেজমেন্ট</p>
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn tab-active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left font-medium transition">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> ড্যাশবোর্ড
            </button>
            <button onclick="switchTab('add-student')" id="btn-add-student" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left font-medium text-slate-700 hover:bg-slate-100 transition">
                <i data-lucide="user-plus" class="w-5 h-5"></i> নতুন শিক্ষার্থী ভর্তি
            </button>
            <button onclick="switchTab('student-list')" id="btn-student-list" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left font-medium text-slate-700 hover:bg-slate-100 transition">
                <i data-lucide="users" class="w-5 h-5"></i> শিক্ষার্থী তালিকা
            </button>
            <button onclick="switchTab('bulk-import')" id="btn-bulk-import" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left font-medium text-slate-700 hover:bg-slate-100 transition">
                <i data-lucide="file-spreadsheet" class="w-5 h-5 text-emerald-600"></i> এক্সেল ডাটা এন্ট্রি
            </button>

            <p class="text-xs font-semibold text-slate-400 uppercase px-3 mt-4 mb-2">পরীক্ষা ও ফলাফল</p>
            <button onclick="switchTab('marks-entry')" id="btn-marks-entry" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left font-medium text-slate-700 hover:bg-slate-100 transition">
                <i data-lucide="edit-3" class="w-5 h-5 text-indigo-600"></i> নম্বর এন্ট্রি ও রেজাল্ট
            </button>
            <button onclick="switchTab('merit-list')" id="btn-merit-list" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left font-medium text-slate-700 hover:bg-slate-100 transition">
                <i data-lucide="award" class="w-5 h-5 text-amber-600"></i> মেরিটলিস্ট ও টেবুলেশন
            </button>
            <button onclick="switchTab('cards-generator')" id="btn-cards-generator" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left font-medium text-slate-700 hover:bg-slate-100 transition">
                <i data-lucide="id-card" class="w-5 h-5 text-purple-600"></i> আইডি ও এডমিট কার্ড
            </button>

            <p class="text-xs font-semibold text-slate-400 uppercase px-3 mt-4 mb-2">এটেন্ডেন্স ও প্যানেল</p>
            <button onclick="switchTab('attendance')" id="btn-attendance" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left font-medium text-slate-700 hover:bg-slate-100 transition">
                <i data-lucide="calendar-check" class="w-5 h-5 text-emerald-600"></i> এটেন্ডেন্স ম্যানেজমেন্ট
            </button>
            <button onclick="switchTab('guardian-login')" id="btn-guardian-login" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left font-medium text-slate-700 hover:bg-slate-100 transition">
                <i data-lucide="shield-check" class="w-5 h-5 text-blue-600"></i> অভিভাবক পোর্টাল
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 md:p-6">
            
            <!-- 1. DASHBOARD TAB -->
            <section id="tab-dashboard" class="tab-content space-y-6">
                <h2 class="text-2xl font-bold text-slate-800">প্রতিষ্ঠানের সারসংক্ষেপ</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-600">
                        <p class="text-sm text-slate-500">মোট শিক্ষার্থী</p>
                        <h3 id="stat-total" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-emerald-600">
                        <p class="text-sm text-slate-500">আজ উপস্থিত</p>
                        <h3 id="stat-present" class="text-3xl font-bold text-emerald-700 mt-1">0</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-pink-600">
                        <p class="text-sm text-slate-500">ছাত্রী (Female)</p>
                        <h3 id="stat-female" class="text-3xl font-bold text-pink-700 mt-1">0</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-amber-500">
                        <p class="text-sm text-slate-500">সক্রিয় শ্রেণি</p>
                        <h3 id="stat-classes" class="text-3xl font-bold text-amber-600 mt-1">0</h3>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-bold mb-4">দ্রুত কার্যক্রম</h3>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="switchTab('add-student')" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2.5 rounded-lg flex items-center gap-2 font-medium">
                            <i data-lucide="plus-circle" class="w-5 h-5"></i> শিক্ষার্থী ভর্তি
                        </button>
                        <button onclick="switchTab('bulk-import')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg flex items-center gap-2 font-medium">
                            <i data-lucide="upload" class="w-5 h-5"></i> এক্সেল ডাটা এন্ট্রি
                        </button>
                        <button onclick="switchTab('cards-generator')" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2.5 rounded-lg flex items-center gap-2 font-medium">
                            <i data-lucide="id-card" class="w-5 h-5"></i> আইডি কার্ড প্রিন্ট
                        </button>
                    </div>
                </div>
            </section>

            <!-- 2. ADD STUDENT TAB -->
            <section id="tab-add-student" class="tab-content hidden">
                <div class="bg-white p-6 rounded-xl shadow-sm max-w-3xl">
                    <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">নতুন শিক্ষার্থী প্রোফাইল তৈরি</h2>
                    <form id="studentForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">শিক্ষার্থীর আইডি (Student ID) *</label>
                            <input type="text" id="studentId" required placeholder="যেমন: 2026001" class="w-full border rounded-lg px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">শিক্ষার্থীর পূর্ণ নাম *</label>
                            <input type="text" id="studentName" required placeholder="নাম লিখুন" class="w-full border rounded-lg px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">শ্রেণি (Class) *</label>
                            <select id="studentClass" required class="w-full border rounded-lg px-3 py-2">
                                <option value="">নির্বাচন করুন</option>
                                <option value="প্লে">প্লে</option><option value="নার্সারি">নার্সারি</option><option value="প্রথম">প্রথম</option><option value="দ্বিতীয়">দ্বিতীয়</option><option value="তৃতীয়">তৃতীয়</option><option value="চতুর্থ">চতুর্থ</option><option value="পঞ্চম">পঞ্চম</option><option value="ষষ্ঠ">ষষ্ঠ</option><option value="সপ্তম">সপ্তম</option><option value="অষ্টম">অষ্টম</option><option value="নবম">নবম</option><option value="দশম">দশম</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">রোল নম্বর *</label>
                            <input type="number" id="studentRoll" required placeholder="যেমন: 1" class="w-full border rounded-lg px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">লিঙ্গ (Gender) *</label>
                            <select id="studentGender" required class="w-full border rounded-lg px-3 py-
